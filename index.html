<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ngopi bulanan  - Undangan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#F8F1E2;font-family:'Plus Jakarta Sans',sans-serif;color:#2B1E14;display:flex;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:460px}
  .card{background:#FFFBF0;border:1px solid #F0E2C5;border-radius:28px;padding:28px;box-shadow:0 14px 50px rgba(60,36,21,.09);margin-bottom:16px;position:relative;overflow:hidden}
  .badge{display:inline-block;background:#2B1E14;color:#FFD28A;font-size:10px;letter-spacing:.15em;font-weight:800;padding:6px 14px;border-radius:100px;margin-bottom:16px;font-family:'Outfit'}
  h1{font-family:'Outfit';font-size:44px;font-weight:800;line-height:.9;letter-spacing:-.03em}
  h1 span{display:block;color:#A07A4A}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .info{background:#FFFDF7;border:1px solid #F2E8D3;border-radius:20px;padding:16px 18px}
  .info label{font-size:10px;letter-spacing:.14em;color:#A68662;font-weight:800;display:block;margin-bottom:6px}
  .info b{font-family:'Outfit';font-size:16px;display:block}
  .info small{font-size:12px;color:#8C6A4A;margin-top:4px;display:block}
  .tempat{grid-column:1 / -1;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#FFFBF0,#FFF2D6)}
  .tempat:hover{transform:translateY(-2px);border-color:#2B1E14;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .tempat b{font-size:19px}
  .map-hint{margin-top:8px;font-size:11px;font-weight:700;background:#2B1E14;color:#FFD28A;display:inline-flex;padding:4px 10px;border-radius:100px}
  input{width:100%;height:48px;border-radius:100px;border:1px solid #F0DDBD;background:#FFFBF0;padding:0 18px 0 42px;font-size:14px;outline:none}
  input:focus{border-color:#2B1E14;background:#fff}
  .btn{height:50px;border-radius:100px;border:none;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;width:100%}
  .btn-dark{background:#2B1E14;color:#fff}
  .btn-dark:active{transform:scale(.98)}
  .btn-light{background:#fff;border:1px solid #E8D5B7;color:#6B4A35}
  .list{margin-top:18px;max-height:260px;overflow-y:auto}
  .item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;border:1px solid #F0DDBD;background:#FFFBF0;margin-bottom:8px}
  .ava{width:32px;height:32px;border-radius:50%;background:#2B1E14;color:#FFD28A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .wa{background:#25D366;color:#fff;border-radius:100px;height:44px;border:none;font-weight:600;cursor:pointer}
  .copy{background:#fff;border:1px solid #E8D5B7;border-radius:100px;height:44px;font-weight:600;cursor:pointer}

  /* TOMBOL PEMBUKA - STYLE SAMA KAYA CARD KAMU */
  #gate{position:fixed;inset:0;z-index:9999;background:#F8F1E2;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .4s ease}
  #gate.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- AUDIO TANPA AUTOPLAY, AKAN DIPICU TOMBOL -->
<audio id="bgMusic" loop preload="auto" playsinline>
  <source src="kopi.mp3" type="audio/mpeg">
</audio>

<!-- INI TOMBOL YANG KAMU MINTA - TIDAK MERUBAH TAMPILAN DALAM -->
<div id="gate">
  <div class="card" style="max-width:460px;width:100%;text-align:center">
    <div class="badge">undangan ngopi</div>
    <h1 style="font-size:36px;margin-bottom:8px">WAYAE <span>NGOPI!</span></h1>
    <p style="font-size:13px;color:#8C6A4A;margin:12px 0 20px;line-height:1.5"> </p>
    <button class="btn btn-dark" onclick="bukaUndangan()">☕ Buka Undangan</button>
    <div style="margin-top:10px;font-size:11px;color:#A68662"> </div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="badge">UNDANGAN NGOPI</div>
    <h1>WAYAE <span>NGOPI!</span></h1>
    <div class="grid">
      <div class="info">
        <label>HARI & TANGGAL</label>
        <b>Minggu, 4 Oktober 2026</b>
      </div>
      <div class="info">
        <label>JAM</label>
        <b>09:00 pagi - Sampek kesel</b>
      </div>
      <div class="info tempat" onclick="window.open('https://maps.app.goo.gl/NUmVTeP9RtSsc8HM7','_blank')">
        <label>TEMPAT 📍</label>
        <b>KLIK DISINI UNTUK MENGETAHUI LOKASI NGOPI</b>
        <small> </small>
        <div class="map-hint">Buka Maps ↗</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b style="font-family:'Outfit';font-size:20px">Mau ikut?</b>
      <span id="count" style="font-size:11px;background:#F5E6C8;padding:4px 10px;border-radius:100px">0 GAS</span>
    </div>
    <div style="position:relative;margin-bottom:12px">
      <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%)">👤</span>
      <input id="nameInput" placeholder="Namamu siapa?" onkeydown="if(event.key==='Enter') gas('ikut')">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-dark" onclick="gas('ikut')">🔥 Gas Ikut!</button>
      <button class="btn btn-light" onclick="gas('skip')">Skip Dulu</button>
    </div>
    <div id="list" class="list"></div>
    <div class="share">
      <button class="wa" onclick="shareWA()">Share WA</button>
      <button class="copy" id="copyBtn" onclick="copyLink()">Copy Link</button>
    </div>
  </div>
</div>

<script>
const listEl = document.getElementById('list');
const nameInput = document.getElementById('nameInput');
const countEl = document.getElementById('count');
let rsvps = [{name:'paijo',status:'ikut'},{name:'bejan',status:'ikut'}];
function render(){
  listEl.innerHTML = rsvps.map(r=>`<div class="item"><div class="ava">${r.name[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:14px">${r.name}</b><br><small style="color:#A68662">${r.status==='ikut'?'Siap ngopi bareng!':'Next time ya'}</small></div><div>${r.status==='ikut'?'☕':'💤'}</div></div>`).join('');
  countEl.textContent = rsvps.filter(r=>r.status==='ikut').length + ' GAS';
}
function gas(status){
  let name = nameInput.value.trim() || 'Teman Ngopi';
  rsvps.unshift({name,status}); nameInput.value=''; render();
}
function shareWA(){
  const text = `Agenda Ngopi Bulanan! ☕\n\n*ngopi bulanan*\nSelasa, 22 September 2026 - 21:00 Sampek kesel\nLokasi: https://maps.app.goo.gl/wjD2KhjoGyGvQa6j6\n\nGas ikut?`;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  const btn=document.getElementById('copyBtn'); btn.textContent='✓ Tersalin'; setTimeout(()=>btn.textContent='Copy Link',2000);
}
render();

// FUNGSI PEMICU MUSIK
const audio = document.getElementById('bgMusic');
const gate = document.getElementById('gate');
audio.volume = 0.5;

function bukaUndangan(){
  audio.play().then(()=>{
    gate.classList.add('hide');
    setTimeout(()=> gate.style.display='none', 400);
  }).catch(()=>{
    alert('File kopi.mp3 tidak ketemu, cek lagi di repo kamu!');
  });
}
</script>
</body>
</html>
